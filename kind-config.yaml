kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-argocd
nodes:
  - role: control-plane
    # Extra port mappings so we can reach the ArgoCD UI and demo app from localhost
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
  - role: worker
